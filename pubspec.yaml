name: grid_wars
description: "A new Flutter game project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.5+6

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI / Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  flutter_spinkit: ^5.2.1
  animate_do: ^4.2.0
  flutter_markdown: ^0.7.7

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.7
  formz: ^0.8.0

  # Navigation
  go_router: ^14.8.1

  # Localization / Date
  easy_localization: ^3.0.8
  intl: ^0.20.2

  # Storage
  shared_preferences: ^2.2.2

  # Dependency Injection
  get_it: ^8.0.3

  # Input / Utils
  mask_text_input_formatter: ^2.9.0
  vibration: ^3.1.4
  url_launcher: ^6.3.1
  top_snackbar_flutter: ^3.3.0

  # Firebase
  firebase_core: ^4.2.1
  firebase_analytics: ^12.0.4
  firebase_remote_config: ^6.1.3

  # JSON
  json_annotation: ^4.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  intl_utils: ^2.8.4

  # App icons
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.jpg"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/memory_card_images/
    - assets/icons/
    - assets/fonts/
    - assets/translations/

  fonts:
    - family: Exo
      fonts:
        - asset: assets/fonts/exo/Exo-Thin.ttf
          weight: 100
        - asset: assets/fonts/exo/Exo-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/exo/Exo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/exo/Exo-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/exo/Exo-Light.ttf
          weight: 300
        - asset: assets/fonts/exo/Exo-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/exo/Exo-Regular.ttf
          weight: 400
        - asset: assets/fonts/exo/Exo-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/exo/Exo-Medium.ttf
          weight: 500
        - asset: assets/fonts/exo/Exo-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/exo/Exo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/exo/Exo-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/exo/Exo-Bold.ttf
          weight: 700
        - asset: assets/fonts/exo/Exo-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/exo/Exo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/exo/Exo-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/exo/Exo-Black.ttf
          weight: 900
        - asset: assets/fonts/exo/Exo-BlackItalic.ttf
          weight: 900
          style: italic